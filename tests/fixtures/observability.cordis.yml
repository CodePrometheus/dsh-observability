# Test-only composition: dsh-observability through the real Loader/app path,
# exporting OTLP/HTTP JSON traces to the mock collector the driver starts (url
# via env). The plugin row loads the BUILT artifact — the same file a
# deployment loads — so run `npm run build` before the e2e.
- id: logger-console
  name: '@deepseek-ai/cordis-plugin-logger-console'
  config:
    colors: false
    levels:
      default: 3
    showTime: ''

- id: mock-llm
  name: './mock-llm.ts'

# Managed child-process groups required by the bash executor.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'

- id: session-telemetry-otlp-traces
  name: '../../lib/index.js'
  config:
    mode: FULL
    exporter:
      url: !!js process.env.DSH_OBSERVABILITY_E2E_URL
    processor:
      # Export promptly so the driver's dispose drains a short queue.
      scheduledDelayMillis: 100

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: observability-mock
        model: observability-mock
        cwd: !!js process.cwd()
    persona: 'Test the dsh-observability backend.'
    workspaceContext: false

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: 'none'

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
