version: 2

updates:
  # The harness is in developer preview and its packages are pinned exactly, so
  # those bumps are deliberate edits, not Dependabot's job — `ignore` keeps it
  # from opening a PR per rc release. The OTel SDK and the toolchain are
  # ordinary ranged dependencies and do belong here.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
    ignore:
      - dependency-name: '@deepseek-ai/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
